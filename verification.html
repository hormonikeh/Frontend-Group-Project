<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Status</title>
  <link rel="stylesheet" href="verification.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="screen">

    <div class="top-bar">
      <h1 class="top-title">Verification Status</h1>
    </div>

    <div class="status-card">
      <div class="icon-wrap">
        <div class="icon-bubble">
          <img src="mingcute_time-line (1).svg" alt="clock" width="40" height="40" />
        </div>
      </div>
      <h2 class="status-heading">Verification Pending</h2>
      <p class="status-note">Your Document is being reviewed.<br />This usually takes 24-48 hours.</p>
      <button class="time-tag">Submitted 2 hours ago</button>
    </div>

    <div class="progress-card">

      <div class="progress-row">
        <div class="step-col">
          <img src="Vector document uploaded.svg" alt="done" width="20" height="20" />
          <div class="step-line"></div>
        </div>
        <span class="step-name">Document Uploaded</span>
      </div>

      <div class="progress-row">
        <div class="step-col">
          <img src="Vector under review.svg" alt="in progress" width="20" height="20" />
          <div class="step-line"></div>
        </div>
        <span class="step-name">Under Review</span>
      </div>

      <div class="progress-row last">
        <div class="step-col">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="9.5" stroke="#000000" stroke-opacity="0.4"/>
          </svg>
        </div>
        <span class="step-name">Verified</span>
      </div>

    </div>

    <div class="info-banner">
      <img src="Vector what happens next.svg" alt="info" class="info-icon" width="20" height="20" />
      <div class="info-body">
        <p class="info-heading">What Happens Next?</p>
        <p class="info-note">We'll notify you via push and email once complete. Your Trust Score will automatically increase by 20 points.</p>
      </div>
    </div>

    <div class="footer-btn">
      <button class="go-back">Back to profile</button>
    </div>

  </div>

</body>
</html>
