<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white flex items-center justify-center">
    <div class="w-full max-w-md lg:max-w-lg px-4 sm:px-6">
        <div class="space-y-6 bg-white p-8 lg:p-12 rounded-3xl shadow-xl">
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold text-black mb-3">Forgot Password</h1>
                    <p class="text-lg sm:text-base text-gray-400">Please, enter your Email Address</p>
                </div>

                <form id="forgotPasswordForm" class="space-y-6">
            
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M4 6h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2z"></path>
                                <path d="M4 6l8 6 8-6"></path>
                            </svg>
                        </div>
                        <input
                            type="email"
                            id="emailInput"
                            placeholder="Enter your email address"
                            class="w-full pl-14 pr-4 py-4 sm:py-3 bg-gray-100 rounded-full text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 transition"
                            required
                        >
                    </div>

                    <div id="errorMessage" class="hidden text-red-500 text-sm"></div>

                    <button
                        type="submit"
                        class="w-full py-4 sm:py-3 bg-blue-900 text-white font-semibold rounded-full hover:bg-blue-800 transition-colors duration-200 text-lg sm:text-base"
                    >
                        Set Password
                    </button>
                </form>

                <div id="successMessage" class="hidden text-green-600 text-center"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
