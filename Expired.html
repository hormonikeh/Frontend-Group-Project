<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
			<title>Session Expired</title>
			<script src="https://cdn.tailwindcss.com"></script>
	    </head>
		<body class="bg-gray-50 min-h-screen font-sans text-gray-900 flex items-center justify-center">
		<div class="max-w-xl mx-auto w-full px-4">
			<header class="relative pt-6 pb-2">
				<h1 class="text-center text-2xl sm:text-3xl font-extrabold">Session Expired</h1>
			</header>

			<main class="px-8 mt-16 text-center">
			<p class="max-w-md mx-auto text-gray-800 text-base sm:text-lg leading-7 mt-8">For your security, your session has timed out. Please sign in again to continue your journey.</p>
				<div class="mt-12 space-y-4 max-w-md mx-auto">
					<button id="signInBtn" class="w-full bg-blue-700 text-white rounded-full py-4 text-lg font-medium shadow-md hover:bg-blue-800 hover:shadow-lg transition-all focus:outline-none">Sign In</button>

					<button id="homeBtn" class="w-full bg-white text-primary rounded-full py-4 text-lg font-medium border-2 border-primary hover:bg-gray-100 hover:shadow-md transition-all focus:outline-none">Return Home</button>
				</div>
			</main>
		</div>

		<script src="script.js"></script>
	</body>
</html>
