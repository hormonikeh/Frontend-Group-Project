<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="min-h-screen flex items-center justify-center px-4 py-8 sm:px-6">
    <div class="w-full max-w-md">
      <section class="rounded-[32px] p-6 sm:p-8">
        

        <div class="space-y-4">
          <div>
            <h1 class="text-2xl sm:text-[2rem] font-semibold text-slate-900">Enter the code we sent you</h1>
            <p class="mt-2 text-sm sm:text-base text-slate-500">We sent it to <span class="font-medium text-slate-900">alabioluwatobi830@gmail.com</span> to verify.</p>
          </div>

          <form id="verificationForm" class="space-y-6">
            <div class="grid grid-cols-6 gap-3">
              <label class="sr-only" for="code-1">Code digit 1</label>
              <input id="code-1" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="tel" class="pin-input h-16 w-full rounded-3xl border border-slate-200 bg-slate-50 text-center text-2xl font-semibold text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" autocomplete="one-time-code" />
              <label class="sr-only" for="code-2">Code digit 2</label>
              <input id="code-2" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="tel" class="pin-input h-16 w-full rounded-3xl border border-slate-200 bg-slate-50 text-center text-2xl font-semibold text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" autocomplete="one-time-code" />
              <label class="sr-only" for="code-3">Code digit 3</label>
              <input id="code-3" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="tel" class="pin-input h-16 w-full rounded-3xl border border-slate-200 bg-slate-50 text-center text-2xl font-semibold text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" autocomplete="one-time-code" />
              <label class="sr-only" for="code-4">Code digit 4</label>
              <input id="code-4" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="tel" class="pin-input h-16 w-full rounded-3xl border border-slate-200 bg-slate-50 text-center text-2xl font-semibold text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" autocomplete="one-time-code" />
              <label class="sr-only" for="code-5">Code digit 5</label>
              <input id="code-5" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="tel" class="pin-input h-16 w-full rounded-3xl border border-slate-200 bg-slate-50 text-center text-2xl font-semibold text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" autocomplete="one-time-code" />
              <label class="sr-only" for="code-6">Code digit 6</label>
              <input id="code-6" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="tel" class="pin-input h-16 w-full rounded-3xl border border-slate-200 bg-slate-50 text-center text-2xl font-semibold text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" autocomplete="one-time-code" />
            </div>

            <p id="retryText" class="text-sm text-slate-500">Don’t see it? <button id="countdown">Retry in 27 seconds</button></p>

            <div class="space-y-3">
              <button type="button" id="checkEmailBtn" class="w-full rounded-full bg-[#08182D] px-4 py-4 text-sm font-semibold text-white shadow-sm hover:bg-slate-800">Check your email</button>
              <button type="submit" class="w-full rounded-full border border-slate-900 bg-white px-4 py-4 text-sm font-semibold text-slate-900 hover:bg-slate-50">Continue</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
