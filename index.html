<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-white text-slate-900">
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-sm bg-white rounded-[2rem] shadow-xl border border-slate-200 p-6 sm:p-8">
        <div class="flex flex-col items-center gap-4">
          <div class="w-20 h-20 flex items-center justify-center">
            <img src="img/Frame 38.png" alt="Brand logo" class="w-12 h-12" />
          </div>
          <h1 class="text-3xl font-semibold">Log in</h1>
        </div>

        <form class="mt-8 space-y-5" id="loginForm">
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-900 mb-2">Email Address</label>
            <input
              id="email"
              type="email"
              placeholder="Enter Email address"
              required
              class="w-full rounded-full border border-slate-200 bg-slate-100 px-5 py-4 text-slate-900 placeholder-slate-400 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-slate-900 mb-2">Password</label>
            <div class="relative">
              <input
                id="password"
                type="password"
                placeholder="Enter Password"
                required
                class="w-full rounded-full border border-slate-200 bg-slate-100 px-5 py-4 pr-14 text-slate-900 placeholder-slate-400 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
              />
              <button
                type="button"
                id="togglePassword"
                aria-label="Toggle password visibility"
                class="absolute inset-y-0 right-4 flex items-center justify-center text-slate-500"
              >
                <img src="img/eye.svg" alt="Toggle password" class="w-5 h-5" />
              </button>
            </div>
          </div>

          <div class="flex justify-end">
            <a href="password.html" class="text-sm font-medium text-slate-500 hover:text-slate-900">Forgot Password</a>
          </div>

          <a
            href="profile.html"
            type="submit"
            class="w-full rounded-full bg-[#1A365D] px-5 py-4 text-white text-base font-semibold shadow-sm transition hover:bg-slate-800"
          >
            Log in
          </a>
        </form>

        <div class="mt-7 flex items-center gap-3 text-slate-500">
          <span class="h-px flex-1 bg-slate-500"></span>
          <span class="text-sm font-semibold uppercase tracking-[0.24em]">or</span>
          <span class="h-px flex-1 bg-slate-500"></span>
        </div>

        <div class="mt-6 space-y-4">
          <button
            type="button"
            class="w-full rounded-full border border-slate-300 bg-white px-5 py-4 text-slate-900 font-medium shadow-sm hover:border-slate-400"
          >
            <div class="flex items-center justify-center gap-3">
              <img src="GOOGLE LOGO.png" alt="Google logo" class="w-6 h-5" />
              <span>Continue with Google</span>
            </div>
          </button>

          <button
            type="button"
            class="w-full rounded-full border border-slate-300 bg-white px-5 py-4 text-slate-900 font-medium shadow-sm hover:border-slate-400"
          >
            <div class="flex items-center justify-center gap-3">
              <img src="img/ic_outline-apple.png" alt="Apple logo" class="w-5 h-5" />
              <span>Continue with Apple</span>
            </div>
          </button>
        </div>

        <p class="mt-7 text-center text-sm text-slate-600">
          Need an account?
          <a href="signup.html" class="font-semibold text-slate-900 hover:text-slate-700">Sign Up</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
