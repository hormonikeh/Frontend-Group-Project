<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-white">
    <div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 py-6 sm:py-12">
        <div class="w-full max-w-md">
            
            <div class="text-center mb-8 sm:mb-10">
                <h1 class="text-3xl sm:text-4xl font-bold text-black mb-2">Create Account</h1>
                <p class="text-gray-500 text-base sm:text-lg">Fill information below to get started</p>
            </div>

            
            <form id="signupForm" class="space-y-5 sm:space-y-6">
                
                <div>
                    <label class="block text-black font-semibold text-sm sm:text-base mb-2">
                        Full name <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input 
                            type="text" 
                            placeholder="Enter your name" 
                            class="w-full pl-12 pr-4 py-3 sm:py-4 rounded-full border-2 border-gray-300 focus:outline-none focus:border-blue-500 placeholder-gray-400"
                            required
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-black font-semibold text-sm sm:text-base mb-2">
                        Email Address <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input 
                            type="email" 
                            placeholder="Enter your email address" 
                            class="w-full pl-12 pr-4 py-3 sm:py-4 rounded-full border-2 border-gray-300 focus:outline-none focus:border-blue-500 placeholder-gray-400"
                            required
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-black font-semibold text-sm sm:text-base mb-2">
                        Password <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input 
                            type="password" 
                            id="password"
                            placeholder="Enter password" 
                            class="w-full pl-12 pr-12 py-3 sm:py-4 rounded-full border-2 border-gray-300 focus:outline-none focus:border-blue-500 placeholder-gray-400"
                            required
                        >
                        <button 
                            type="button" 
                            class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
                            onclick="togglePassword('password')"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>


                <div>
                    <label class="block text-black font-semibold text-sm sm:text-base mb-2">
                        Confirm Password <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input 
                            type="password" 
                            id="confirmPassword"
                            placeholder="Confirm password" 
                            class="w-full pl-12 pr-12 py-3 sm:py-4 rounded-full border-2 border-gray-300 focus:outline-none focus:border-blue-500 placeholder-gray-400"
                            required
                        >
                        <button 
                            type="button" 
                            class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
                            onclick="togglePassword('confirmPassword')"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                
                <button 
                    type="submit" 
                    class="w-full bg-[#1A365D] hover:bg-[#08182D] text-white font-semibold py-3 sm:py-4 rounded-full transition duration-200 text-base sm:text-lg mt-6 sm:mt-8"
                >
                    Sign Up
                </button>
            </form>

            <div class="flex items-center justify-center mt-6 sm:mt-8">
                <label class="flex items-center cursor-pointer gap-2 sm:gap-3">
                    <input type="checkbox" class="w-5 h-5 sm:w-6 sm:h-6 rounded cursor-pointer" required>
                    <span class="text-gray-700 text-sm sm:text-base">I agree to the 
                        <a href="#" class="text-blue-500 hover:underline">Terms of Service</a> 
                        and 
                        <a href="#" class="text-blue-500 hover:underline">Privacy Policy</a>
                    </span>
                </label>
            </div>

            <div class="flex items-center my-6 sm:my-8">
                <div class="flex-grow h-px bg-gray-300"></div>
                <span class="px-4 text-gray-600 font-semibold text-sm">OR</span>
                <div class="flex-grow h-px bg-gray-300"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
                <button 
                    type="button"
                    class="flex-1 flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-black font-semibold py-3 sm:py-4 rounded-full transition text-sm sm:text-base"
                >
                    <img
                    src="img/google.svg"
                    alt="Google"
                    class="w-5 h-5"
                    >
                    <a href="email2.html">Google</a>
                </button>
                <button 
                    type="button"
                    class="flex-1 flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-black font-semibold py-3 sm:py-4 rounded-full transition text-sm sm:text-base"
                >
                    <i class="fab fa-apple"></i>
                    <span>Apple</span>
                </button>
            </div>

            <div class="text-center mt-6 sm:mt-8">
                <p class="text-gray-700 text-sm sm:text-base">
                    Already have an account? 
                    <a href="index.html" class="text-blue-600 font-semibold hover:underline">Log In</a>
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
